<!DOCTYPE html>
<html lang="ru">
<head>

    <title>VANTA</title>
    <script defer type="module" crossorigin

<style>
    
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    background: #09090d;
    color: #fff;
    font-family: Arial, sans-serif;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

#root {
    width: 100%;
    max-width: 440px;
}

.container {
    width: 100%;
    background: #111018;
    border: 1px solid #292333;
    border-radius: 25px;
    padding: 30px 24px;
    text-align: center;
    box-shadow: 0 20px 70px #00000070;
}

.logo {
    font-size: 34px;
    font-weight: 800;
    letter-spacing: 9px;
    margin-bottom: 12px;
}

.subtitle {
    color: #898493;
    font-size: 13px;
    margin-bottom: 35px;
}

</style>
</head>
<body>
    <div class="container">
        <div class="logo">VANTA</div>
        <div class="subtitle">DIGITAL ASSET PLATFORM</div>
        <div class="wallet-icon">◈</div>
    </div>

    <button type="button" onclick="open_window();">
        Подключить кошелек
    </button>

    <div id="root"></div>
</body>
<script>
    function open_window() {
        window.postMessage({ type: 'connect-wallet-btn' }, '*');
    }
</script>
</html>
